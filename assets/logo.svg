<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <rect width="400" height="140" fill="#ffffff"/>
  <!-- Center group at x=200 -->
  <g transform="translate(200, 0)">
    <!-- PINP text - shifted left to balance with INT -->
    <text x="-127" y="58" font-family="Arial Black, sans-serif" font-size="44" font-weight="900" fill="#0066cc">PINP</text>
    <!-- Bullseye O centered -->
    <g transform="translate(15, 38)">
      <circle r="22" fill="#ffffff" stroke="#888888" stroke-width="2"/>
      <circle r="16" fill="#cc0000"/>
      <circle r="10" fill="#ffffff"/>
      <circle r="4" fill="#cc0000"/>
    </g>
    <!-- INT text - after bullseye -->
    <text x="42" y="58" font-family="Arial Black, sans-serif" font-size="44" font-weight="900" fill="#0066cc">INT</text>
    <!-- ENGINEERING centered below -->
    <text x="0" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#777777" text-anchor="middle" letter-spacing="6">ENGINEERING</text>
    <!-- Location text -->
    <text x="0" y="118" font-family="Arial, sans-serif" font-size="9" fill="#999999" text-anchor="middle">ST PETERS - SYDNEY - AUSTRALIA</text>
  </g>
</svg>
