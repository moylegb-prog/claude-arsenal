<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;display=swap');
      .blue-text { font-family: 'Montserrat', Arial Black, sans-serif; font-size: 72px; font-weight: 900; fill: #0066cc; }
      .gray-text { font-family: 'Montserrat', Arial, sans-serif; font-size: 28px; font-weight: 300; fill: #777; letter-spacing: 12px; }
      .location { font-family: 'Montserrat', Arial, sans-serif; font-size: 11px; fill: #999; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#ffffff"/>

  <!-- PINP -->
  <text x="50" y="95" class="blue-text">PINP</text>

  <!-- Bullseye O -->
  <g transform="translate(270, 60)">
    <!-- Gray outer ring -->
    <circle r="32" fill="#ffffff" stroke="#888888" stroke-width="3"/>
    <!-- Red ring -->
    <circle r="23" fill="#cc0000"/>
    <!-- White ring -->
    <circle r="14" fill="#ffffff"/>
    <!-- Red center -->
    <circle r="6" fill="#cc0000"/>
  </g>

  <!-- INT -->
  <text x="310" y="95" class="blue-text">INT</text>

  <!-- ENGINEERING -->
  <text x="115" y="135" class="gray-text">ENGINEERING</text>

  <!-- Location -->
  <text x="175" y="175" class="location">ST PETERS · SYDNEY · AUSTRALIA</text>
</svg>