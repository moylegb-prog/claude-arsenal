<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180">
  <defs>
    <style>
      .blue-text { font-family: 'Arial Black', 'Montserrat', sans-serif; font-size: 60px; font-weight: 900; fill: #0066cc; }
      .gray-text { font-family: 'Arial', 'Montserrat', sans-serif; font-size: 24px; font-weight: 300; fill: #777777; letter-spacing: 10px; }
      .location { font-family: 'Arial', 'Montserrat', sans-serif; font-size: 10px; fill: #999999; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="500" height="180" fill="#ffffff"/>

  <!-- PINP + Bullseye O + INT - CENTERED -->
  <g transform="translate(250, 70)">
    <!-- PINP -->
    <text x="-175" y="0" class="blue-text" text-anchor="start">PINP</text>

    <!-- Bullseye O centered -->
    <g transform="translate(-22, -22)">
      <circle r="28" fill="#ffffff" stroke="#888888" stroke-width="2"/>
      <circle r="20" fill="#cc0000"/>
      <circle r="12" fill="#ffffff"/>
      <circle r="5" fill="#cc0000"/>
    </g>

    <!-- INT -->
    <text x="15" y="0" class="blue-text" text-anchor="start">INT</text>
  </g>

  <!-- ENGINEERING - CENTERED -->
  <text x="250" y="110" class="gray-text" text-anchor="middle">ENGINEERING</text>

  <!-- St Peters - as is -->
  <text x="250" y="155" class="location" text-anchor="middle">ST PETERS · SYDNEY · AUSTRALIA</text>
</svg>